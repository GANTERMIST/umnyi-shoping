<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>УШ</text></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Умный Шопинг — цены на игры</title>
    <script>
      // После выкладки новой версии старый index.html из кеша ссылается на удалённые файлы — перезагружаемся один раз
      addEventListener('error', function (e) {
        var t = e.target
        if (t && t.tagName === 'SCRIPT' && /\/assets\//.test(t.src || '') && !sessionStorage.getItem('us-reloaded')) {
          sessionStorage.setItem('us-reloaded', '1'); location.reload()
        }
      }, true)
      addEventListener('load', function () { setTimeout(function () { sessionStorage.removeItem('us-reloaded') }, 5000) })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
